  function processing() {

      if(s!=='idle') content+='<section class="mm-backgroundjob"><strong>Próxima etapa do produto</strong>'+status(s)+'<div class="mm-actions">'+link(['completed','empty'].includes(s)?'Abrir resultado':'Ver detalhes','result')+(['completed','empty','cancelled','cancelRequested','error','interrupted'].includes(s)?'':link('Cancelar','cancel'))+(s==='cancelled'?link('Retomar','resume'):'')+'</div></section>';

  function settings() {
    return chrome('<main class="mm-main mm-settings"><div class="mm-heading"><div><h1>Configurações</h1><p>Preferências salvas neste perfil do navegador.</p></div></div><form id="mm-settings-form"><section class="mm-settings-section"><h2>Conexão Gemini</h2><div class="mm-settingbody"><label class="mm-field" for="mm-key">Chave da API<div class="mm-key"><input id="mm-key" type="'+(state.showKey?'text':'password')+'" value="chave-ficticia-da-previa" autocomplete="off" spellcheck="false" aria-describedby="mm-key-help">'+button(state.showKey?'Ocultar':'Mostrar','show-key')+'</div></label><p id="mm-key-help">A chave fica no perfil local e pode ser recuperada por quem controla este computador. Salvar não testa o acesso à API.</p></div></section><section class="mm-settings-section"><h2>Geração de notas</h2><div class="mm-settingbody"><label class="mm-field" for="mm-model">Modelo para novas sessões<select id="mm-model"><option>Econômico · Gemini 3.5 Flash-Lite</option><option>Equilibrado · Gemini 3.6 Flash</option><option>Avançado · Gemini 3.8 Flash</option></select></label><p>Sessões anteriores mantêm o modelo escolhido. Não há troca automática em falhas.</p></div></section><section class="mm-settings-section"><h2>Áudio local</h2><div class="mm-settingbody"><fieldset style="border:0;padding:0;margin:0;display:grid;gap:18px"><legend style="font-size:13px;font-weight:500;margin-bottom:14px">Depois de transcrever</legend><label class="mm-radio"><input type="radio" name="mm-retention" value="delete" checked><span><strong>Apagar áudio após transcrever</strong><span>Notas e texto permanecem. O áudio é liberado após a limpeza remota; não poderá ser ouvido ou retranscrito.</span></span></label><label class="mm-radio"><input type="radio" name="mm-retention" value="keep"><span><strong>Manter gravação local</strong><span>Preserva áudio para revisão e ocupa espaço neste perfil.</span></span></label></fieldset><p>Material com falha é preservado. A preferência vale para novas sessões.</p><p>Idioma de transcrição: Português brasileiro.</p></div></section><section class="mm-settings-section"><h2>Armazenamento</h2><div class="mm-settingbody"><p>186 MB de áudio · estimativa fictícia nesta prévia.</p>'+link('Gerenciar reuniões e liberar espaço','manage-library')+'</div></section><section class="mm-settings-section"><h2>Privacidade</h2><div class="mm-settingbody"><p>Áudio é enviado à Gemini para transcrição; texto é enviado para gerar notas. A captura e os resultados ficam neste perfil.</p><details><summary class="cursor-interaction">Processamento e retenção</summary><p>As chamadas usam store:false e os arquivos remotos conhecidos têm limpeza própria. Isso não descreve toda a política de dados do provedor.</p></details></div></section><div class="mm-save">'+button('Salvar configurações','save-settings','mm-primary')+'</div></form></main>');
  }
  function importing() {
    return chrome('<main class="mm-main mm-import"><div class="mm-back">'+link(icon('arrow-left')+'Biblioteca','library')+'</div><h1>Importar áudio</h1><p class="mm-muted" style="margin-top:10px">Uma gravação local, com o mesmo fluxo de transcrição e notas.</p>'+(state.file?'<div class="mm-file">'+icon('file-audio')+'<div><strong>Reunião de produto.mp3</strong><p class="mm-muted mm-small">24min10s · 18,6 MB · arquivo fictício</p></div>'+link('Trocar','change-file')+'</div><label class="mm-field" for="mm-import-profile">Perfil<select id="mm-import-profile">'+profiles+'</select></label><div class="mm-notice">'+icon('cloud-upload')+'<div><strong>Importar e processar envia o áudio à Gemini</strong><p class="mm-small mm-muted">Depois da transcrição, o texto será usado para gerar notas. Retenção: apagar áudio após transcrever e concluir a limpeza.</p></div></div><div class="mm-actions">'+button('Importar e processar','confirm-import','mm-primary')+button('Cancelar','library','mm-quiet')+'</div>':'<div class="mm-upload">'+icon('upload')+'<h2>Escolha um arquivo de áudio</h2><p>Proposta inicial: MP3, M4A, WAV ou WebM<br>Até 29min30s · teto proposto de 100 MiB</p>'+button('Usar arquivo de exemplo','choose-file','mm-primary')+'</div><p class="mm-muted mm-small">Etapa posterior · seleção e validação simuladas. Nenhum arquivo real é lido ou enviado.</p>')+'</main>');

  function refreshIcons() { if(globalThis.lucide) globalThis.lucide.createIcons({ attrs:{ width:17,height:17 } }); }
  function render() {
    root.querySelectorAll('.mm-previewnav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.route===state.route)));
    root.querySelector('.mm-demo-controls').hidden=!['popup','result'].includes(state.route);
    scenarioControl.value=state.scenario;
    stage.innerHTML=({library,popup,result,settings,import:importing}[state.route] || library)();
    const search=root.querySelector('#mm-search'); if(search) search.value=state.search;
    const sort=root.querySelector('#mm-sort'); if(sort) sort.value=state.sort;
    const profile=root.querySelector('#mm-profile'); if(profile) profile.value=state.profile;
    const pop=root.querySelector('.mm-popup'); if(pop) pop.style.width=state.popupWidth+'px';
    root.style.setProperty('--mm-row-space',state.rowSpace+'px');
    refreshIcons();
  }
  function navigate(route) { state.route=route; toast.hidden=true; render(); remember(); }
  function remember() { if(window.openai && typeof window.openai.setWidgetState==='function') window.openai.setWidgetState({modelContent:{screen:state.route,popupCompact:state.compact,popupWidth:state.popupWidth},privateContent:{scenario:state.scenario,pane:state.pane}}).catch(()=>{}); }
  function restore(saved) { if(!saved)return; const m=saved.modelContent||{},p=saved.privateContent||{}; if(['library','popup','result','settings','import'].includes(m.screen))state.route=m.screen; if(typeof m.popupCompact==='boolean')state.compact=m.popupCompact; if(['380','420'].includes(m.popupWidth))state.popupWidth=m.popupWidth; if(statusInfo[p.scenario])state.scenario=p.scenario; if(['notes','transcript','audio'].includes(p.pane))state.pane=p.pane; }
  root.addEventListener('input',e=>{ if(e.target.id==='mm-search'){state.search=e.target.value;root.querySelector('.mm-list').innerHTML=listRows();refreshIcons();} });
  root.addEventListener('change',e=>{if(e.target.id==='mm-profile')state.profile=e.target.value;if(e.target.id==='mm-sort'){state.sort=e.target.value;root.querySelector('.mm-list').innerHTML=listRows();refreshIcons();} if(e.target.id==='mm-scenario'){state.scenario=e.target.value;state.pane='notes';render();remember();}});
  root.addEventListener('submit',e=>e.preventDefault());
  root.addEventListener('click',e=>{
    const el=e.target.closest('[data-route],[data-action],[data-pane],[data-meeting]'); if(!el)return;
    if(el.dataset.route){ if(el.dataset.route==='result' && state.route!=='result'){state.scenario='completed';state.pane='notes';} navigate(el.dataset.route); return; }
    if(el.dataset.meeting){state.selected=el.dataset.meeting;state.scenario=allRows().find(r=>r.id===state.selected).status;state.pane='notes';navigate('result');return;}
    if(el.dataset.pane){state.pane=el.dataset.pane;render();remember();return;}
    const action=el.dataset.action;
    if(['library','popup','settings','import','result'].includes(action)){if(action==='result')state.pane='notes';navigate(action);return;}
    if(action==='start'){state.scenario='recording';render();notify('Simulação: gravação iniciada. Nenhum áudio é capturado.');}
    if(action==='stop'){if(state.scenario==='recording'){state.scenario='analyzing';render();notify('Simulação: gravação finalizada; notas em processamento.');} }
    if(action==='cancel'){state.scenario='cancelRequested';render();notify('Simulação: pedido registrado. Selecione “Cancelado” para avaliar o estado confirmado.');}
    if(action==='resume'){state.scenario='analyzing';render();notify('Simulação: mesma sessão retomada. Nenhum dado é enviado.');}
    if(['copy','copy-transcript','export','play'].includes(action))notify({copy:'Simulação de cópia de notas. A área de transferência não foi alterada.','copy-transcript':'Simulação de cópia da transcrição.',export:'Simulação de exportação Markdown. Nenhum arquivo foi gerado.',play:'O player é ilustrativo; não há áudio nesta prévia.'}[action]);
    if(['notes','transcript','source'].includes(action)){state.pane=action==='notes'?'notes':'transcript';render();remember();if(action==='source')notify('Fonte fictícia da Parte 1 aberta.');}
    if(action==='storage'){state.storage=!state.storage;render();}
    if(action==='manage-library'){state.storage=true;navigate('library');}
    if(action==='choose-file'){state.file=true;render();}
    if(action==='change-file'){state.file=false;render();}
    if(action==='confirm-import'){state.imported=true;state.file=false;navigate('library');notify('Importação simulada na biblioteca. Nenhum arquivo foi lido ou enviado.');}
    if(action==='show-key'){state.showKey=!state.showKey;const input=root.querySelector('#mm-key');input.type=state.showKey?'text':'password';el.textContent=state.showKey?'Ocultar':'Mostrar';}
    if(action==='save-settings')notify('Simulação: preferências salvas. As configurações reais não foram alteradas.');
    if(action==='delete-audio'||action==='delete-session'){
      state.deleteKind=action==='delete-audio'?'audio':'session';
      root.querySelector('#mm-dialog-title').textContent=state.deleteKind==='audio'?'Excluir áudio desta reunião?':'Excluir esta sessão inteira?';
      root.querySelector('#mm-dialog-description').textContent=state.deleteKind==='audio'?'Próxima etapa do produto · 18,6 MB estimados. Notas e transcrição serão mantidas. O áudio removido não poderá ser ouvido ou retranscrito.':'Próxima etapa do produto: áudio, transcrição e notas serão excluídos. Esta ação não poderá ser desfeita.';
      root.querySelector('[data-action="confirm-delete"]').textContent=state.deleteKind==='audio'?'Excluir áudio':'Excluir sessão';dialog.showModal();
    }
    if(action==='close-dialog')dialog.close();
    if(action==='confirm-delete'){dialog.close();notify('Confirmação simulada. Nenhum dado foi excluído.');}
  });
  restore(window.openai && window.openai.widgetState);
  render();
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
  if(globalThis.Tweak){const tweak=new globalThis.Tweak({container:stage,onChange:()=>{render();remember();}});tweak.addToggle(state,'compact',{label:'Popup com fontes compactas'});tweak.addSelect(state,'popupWidth',{label:'Largura do popup',options:[{label:'380 px',value:'380'},{label:'420 px',value:'420'}]});tweak.addSlider(state,'rowSpace',{label:'Espaço vertical da lista',min:12,max:24,step:2,unit:'px',reference:'--mm-row-space'});}
})();
</script>
